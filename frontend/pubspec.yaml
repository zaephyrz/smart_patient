name: frontend
description: Smart Patient
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client
  dio: ^5.11.0
  http: ^1.6.0

  # State Management
  flutter_riverpod: ^3.4.2
  riverpod: ^3.4.2

  # Security
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0
  local_auth: ^3.0.2
  pinput: ^6.0.2

  # UI Components
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  shimmer: ^4.0.0
  syncfusion_flutter_calendar: ^34.2.5
  syncfusion_flutter_datepicker: ^34.2.5
  syncfusion_flutter_core: ^34.2.5
  intl: ^0.20.3

  # File handling
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  file_picker: ^12.1.1
  open_filex: ^4.7.0
  permission_handler: ^13.0.1
  path_provider: ^2.1.6

  # Notifications
  flutter_local_notifications: ^22.3.0

  # Utilities
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  go_router: ^18.0.0
  clipboard: ^3.0.14
  share_plus: ^13.3.0
  connectivity_plus: ^7.3.1
  flutter_dotenv: ^6.0.1

  # Jitsi Meet for telemedicine
  cupertino_icons: ^1.0.9
  jitsi_meet_flutter_sdk: ^13.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: 2.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/icons/
    - assets/fonts/
    - .env

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21